spring.application.name=SistemaGestionGym

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Datasource MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/gym_management?useSSL=false&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# validate: el script SQL es la fuente de verdad del esquema, Hibernate NO debe
# crear ni alterar tablas (evita divergencias entre el modelo Java y las
# constraints/checks que ya definiste en el .sql)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# --- JWT (se usará en Proceso 1) ---
app.jwt.secret=${JWT_SECRET:avOSAGnMhPA3z/DIkAEhnmWOxM0IGJZvgp1anPznTGs=}
app.jwt.expiration-ms=86400000

# --- CORS (usado por CorsConfig) ---
app.cors.allowed-origins=http://localhost:4200