<form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
    <app-modal [title]="esEdicion() ? 'Editar usuario' : 'Nuevo usuario'" size="lg" (closed)="closed.emit()">
        @if (error()) { <div class="alert alert--error" role="alert">{{ error() }}</div> }

        <div class="form-grid">
            <app-form-field label="Nombre" [required]="true" [control]="form.controls.nombre">
                <input class="input" formControlName="nombre" />
            </app-form-field>
            <app-form-field label="Apellido" [required]="true" [control]="form.controls.apellido">
                <input class="input" formControlName="apellido" />
            </app-form-field>

            <app-form-field label="Email" [required]="true" [control]="form.controls.email">
                <input class="input" type="email" formControlName="email" />
            </app-form-field>
            <app-form-field [label]="esEdicion() ? 'Nueva contraseña' : 'Contraseña'" [required]="!esEdicion()"
                [hint]="esEdicion() ? 'Déjala en blanco para conservar la actual' : 'Entre 8 y 72 caracteres'"
                [control]="form.controls.password"
                mensajePatron="Debe tener entre 8 y 72 caracteres, o dejarse en blanco">
                <input class="input" type="password" formControlName="password" autocomplete="new-password" />
            </app-form-field>

            <app-form-field label="Teléfono" [control]="form.controls.telefono"
                mensajePatron="Debe tener entre 7 y 15 dígitos">
                <input class="input" formControlName="telefono" inputmode="tel" />
            </app-form-field>
            <app-form-field label="Fecha de nacimiento" [control]="form.controls.fechaNacimiento">
                <input class="input" type="date" formControlName="fechaNacimiento" />
            </app-form-field>

            <app-form-field label="Género" [control]="form.controls.genero">
                <select class="select" formControlName="genero">
                    @for (g of generos; track g.value) { <option [value]="g.value">{{ g.label }}</option> }
                </select>
            </app-form-field>
            <app-form-field label="Rol" [required]="true" [control]="form.controls.rolId">
                <select class="select" formControlName="rolId">
                    <option [ngValue]="null" disabled>Seleccione un rol</option>
                    @for (r of roles(); track r.id) { <option [ngValue]="r.id">{{ r.nombre }}</option> }
                </select>
            </app-form-field>
        </div>

        <div modal-footer>
            <app-button variant="secondary" (click)="closed.emit()">Cancelar</app-button>
            <app-button type="submit" [loading]="guardando()">{{ esEdicion() ? 'Guardar cambios' : 'Crear usuario'
                }}</app-button>
        </div>
    </app-modal>
</form>
