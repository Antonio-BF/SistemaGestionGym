<app-page-header title="Roles"
    subtitle="Los roles definen los permisos de acceso. El nombre se guarda en mayúsculas." />

<div class="grid-2">
    <div class="card">
        <div class="card__header">
            <h2>Nuevo rol</h2>
        </div>
        <form class="card__body" [formGroup]="form" (ngSubmit)="crear()" novalidate>
            <app-form-field label="Nombre del rol">
                <input class="input" formControlName="nombre" placeholder="Ej. NUTRICIONISTA" autocomplete="off" />
            </app-form-field>
            <button appButton type="submit" [loading]="guardando()">
                <app-icon name="plus" [size]="16" /> Crear rol
            </button>
        </form>
    </div>

    <div class="card">
        <div class="card__header">
            <h2>Roles registrados</h2>
        </div>
        <app-list-state [loading]="lista.loading()" [error]="lista.error()" [empty]="(lista.data()?.length ?? 0) === 0"
            emptyText="No hay roles registrados." (retry)="lista.load()">
            <div class="table-wrap">
                <table class="table table--stack">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (r of lista.data(); track r.id) {
                        <tr>
                            <td data-label="ID">{{ r.id }}</td>
                            <td data-label="Nombre"><strong>{{ r.nombre }}</strong></td>
                            <td class="actions">
                                <button appButton="ghost" size="icon" type="button" title="Eliminar"
                                    aria-label="Eliminar rol" (click)="porEliminar.set(r)">
                                    <app-icon name="trash" />
                                </button>
                            </td>
                        </tr>
                        }
                    </tbody>
                </table>
            </div>
        </app-list-state>
    </div>
</div>

@if (porEliminar(); as r) {
<app-confirm-dialog title="Eliminar rol"
    [message]="'¿Eliminar el rol ' + r.nombre + '? Solo es posible si no tiene usuarios asociados.'"
    confirmText="Eliminar" danger [loading]="eliminando()" (confirmed)="eliminar()"
    (cancelled)="porEliminar.set(null)" />
}
