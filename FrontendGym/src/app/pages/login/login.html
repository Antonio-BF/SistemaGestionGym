<section class="login">
    <aside class="login__brand">
        <div class="brand-content">
            <span class="logo">G</span>
            <h1>Gimnasio<br />CIBERTEC</h1>
            <p>Panel de administración de socios y membresías.</p>
        </div>
        <div class="rings"></div>
    </aside>

    <main class="login__panel">
        <form class="login__form" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
            <h2>Iniciar sesión</h2>
            <p class="muted subtitle">Ingresa con tus credenciales.</p>

            @if (error()) {
            <div class="alert alert--error" role="alert">{{ error() }}</div>
            }

            <app-form-field label="Correo electrónico" [control]="form.controls.email">
                <input class="input" type="email" formControlName="email" autocomplete="username"
                    placeholder="admin@gym.com" />
            </app-form-field>

            <app-form-field label="Contraseña" [control]="form.controls.password">
                <input class="input" type="password" formControlName="password" autocomplete="current-password" />
            </app-form-field>

            <app-button type="submit" block [loading]="loading()">Ingresar</app-button>
            <p class="hint">Usuario de prueba: admin&#64;gym.com</p>
        </form>
    </main>
</section>
